<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="4:6タイマー">
<title>4:6メソッド タイマー</title>
<style>
  /* ===== 配色（ライト／ダーク） ===== */
  :root {
    --bg: #ECEFF1;
    --ink: #2B1E18;
    --muted: #6B6058;
    --blue: #2E5E8E;         /* 前半：甘み・酸味 */
    --blue-track: #CFDCEA;
    --brown: #8A5330;        /* 後半：濃度 */
    --brown-track: #E0D6CE;
    --on-blue: #FFFFFF;
    --flash: #FFF0B8;        /* 投の切り替わりで一瞬光る色 */
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1B1512;
      --ink: #F0E8E2;
      --muted: #A9998E;
      --blue: #7FAEDD;
      --blue-track: #2B3B4B;
      --brown: #C58A5E;
      --brown-track: #3A2E27;
      --on-blue: #10202F;
      --flash: #4A3B12;
      color-scheme: dark;
    }
  }

  /* ===== 全体 ===== */
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  main {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 20px 16px;
    display: flex;
    flex-direction: column;
  }

  /* 前半(a)・後半(b)の色。バー・凡例・説明文で共通に使う */
  .a { --tone: var(--blue);  --track: var(--blue-track); }
  .b { --tone: var(--brown); --track: var(--brown-track); }

  /* ===== 何投目か（主役） ===== */
  .pour {
    padding: 8px 12px 14px;
    border-radius: 18px;
    text-align: center;
  }
  .pour.flash { animation: flash 0.9s ease-out; }
  @keyframes flash {
    from { background: var(--flash); }
    to   { background: transparent; }
  }
  .pour-num {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 1;
  }
  .pour.idle .pour-num { color: var(--muted); }
  .pour-num .n {
    font-size: clamp(120px, 40vw, 190px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pour-num .u    { font-size: clamp(30px, 9vw, 42px); font-weight: 600; }
  .pour-num .done { font-size: clamp(56px, 18vw, 84px); font-weight: 600; padding: 30px 0 22px; }
  .phase {
    margin: 6px 0 0;
    min-height: 1.5em;
    font-size: 16px;
    font-weight: 600;
    color: var(--tone, var(--muted));
  }

  /* ===== 経過時間・次の合図 ===== */
  .time {
    margin-top: 6px;
    text-align: center;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    font-size: clamp(64px, 21vw, 100px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .next {
    margin-top: 4px;
    min-height: 1.6em;
    text-align: center;
    font-size: 16px;
    color: var(--muted);
  }
  .next b {
    margin-left: 6px;
    font-size: 20px;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  /* ===== タイムライン ===== */
  .timeline { display: flex; gap: 4px; margin-top: 26px; }
  .cell { min-width: 0; }
  .bar {
    position: relative;
    height: 16px;
    border-radius: 8px;
    overflow: hidden;
    background: var(--track);
  }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--tone); }
  .lab {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-top: 8px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .lab .k { margin-right: 4px; font-size: 16px; font-weight: 700; }
  .cell.now .lab { color: var(--ink); }
  .cell.now .lab .k { font-size: 20px; }

  .legend { display: flex; gap: 16px; margin-top: 12px; font-size: 13px; color: var(--muted); }
  .legend i {
    display: inline-block;
    width: 10px;
    height: 10px;
    margin-right: 6px;
    border-radius: 5px;
    background: var(--tone);
  }

  /* ===== 操作 ===== */
  .controls { display: flex; gap: 12px; margin-top: auto; padding-top: 28px; }
  .btn {
    flex: 1;
    min-height: 68px;
    border: 2px solid var(--ink);
    border-radius: 16px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn.start { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn:focus-visible, .link:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
  .link {
    padding: 10px 4px;
    border: 0;
    background: none;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .note { margin: 8px 0 0; font-size: 12px; line-height: 1.6; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .pour.flash { animation: none; }
  }
</style>
</head>
<body>
<main>
  <section class="pour idle" id="pour">
    <div class="pour-num" id="pourNum"></div>
    <p class="phase" id="phase" aria-live="polite"></p>
  </section>

  <div class="time" id="time" role="timer" aria-label="経過時間"></div>
  <div class="next" id="next"></div>

  <div class="timeline" id="timeline" aria-hidden="true"></div>
  <div class="legend" aria-hidden="true">
    <span class="a"><i></i>前半 甘み・酸味</span>
    <span class="b"><i></i>後半 濃度</span>
  </div>

  <div class="controls">
    <button class="btn start" id="btnStart">開始</button>
    <button class="btn" id="btnStop" disabled>停止</button>
  </div>

  <div class="foot">
    <button class="link" id="btnReset">リセット</button>
    <button class="link" id="btnTest">音を確認</button>
  </div>
  <p class="note" id="note">音が出ないときは、iPhoneの消音スイッチ（側面）をオフにして、音量を上げてください。</p>
</main>

<script>
(() => {
  'use strict';

  /* ==================================================================
   * 設定
   * ================================================================== */

  // 4:6メソッドの抽出スケジュール（秒）
  //   phase: 'a' = 前半40%（甘み・酸味を決める） / 'b' = 後半60%（濃度を決める）
  const POURS = [
    { start: 0,   end: 45,  phase: 'a' },   // 1投目
    { start: 45,  end: 90,  phase: 'a' },   // 2投目
    { start: 90,  end: 135, phase: 'b' },   // 3投目
    { start: 135, end: 165, phase: 'b' },   // 4投目
    { start: 165, end: 210, phase: 'b' },   // 5投目
  ];
  const FINISH = 210;                                   // 3:30 抽出終了
  const DONE = POURS.length;                            // 「抽出完了」を表すインデックス
  const POUR_CHANGES = POURS.slice(1).map(p => p.start); // 投の切り替え合図：45・90・135・165秒
  const PHASE_TEXT = {
    a: '甘み・酸味を決める（前半40%）',
    b: '濃度を決める（後半60%）',
  };

  // 音の設定
  const SOUND = {
    signalFreq: 1047,      // 開始・投の切り替え（ド）
    stopFreq: 784,         // 停止（ソ・低め）
    signalGap: 0.34,       // 2回鳴らすときの間隔（秒）
    lead: 0.02,            // 「今すぐ鳴らす」ときの遅延（秒）
    chime: { peak: 0.85, attack: 0.015, hold: 0.07, decay: 0.32,
             partials: [{ ratio: 1, level: 1 }, { ratio: 2, level: 0.22 }] },
    beepVolume: 0.9,       // 終了音の音量（最大 1.0）
    finishNotes: [         // 終了音：ド・ミ・ソと上がり、最後を長めに
      { at: 0.00, freq: 1047, dur: 0.15 },
      { at: 0.20, freq: 1319, dur: 0.15 },
      { at: 0.40, freq: 1568, dur: 0.60 },
    ],
  };

  /* ==================================================================
   * ユーティリティ
   * ================================================================== */

  const $ = id => document.getElementById(id);
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  // 失敗しても止まらないように包む（Promiseを返さない古いAPIにも対応）
  const quiet = fn => {
    try { return Promise.resolve(fn()).catch(() => {}); }
    catch (e) { return Promise.resolve(); }
  };

  // 秒 → m:ss
  const formatTime = sec => {
    sec = Math.max(0, Math.floor(sec));
    const s = sec % 60;
    return `${Math.floor(sec / 60)}:${s < 10 ? '0' : ''}${s}`;
  };

  // 内容が変わったときだけ書き換える（無駄な再描画と読み上げを避ける）
  const setHTML = (el, html) => {
    if (el._html !== html) { el._html = html; el.innerHTML = html; }
  };

  // 経過秒 → 今何投目か（0始まり。終了後は DONE）
  const pourIndexAt = t => {
    if (t >= FINISH) return DONE;
    for (let i = POURS.length - 1; i > 0; i--) if (t >= POURS[i].start) return i;
    return 0;
  };

  /* ==================================================================
   * 音（Web Audio）
   * ================================================================== */

  const sound = (() => {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let ctx = null;
    let nodes = [];                       // 予約済みの音（停止時にまとめて取り消す）

    const isRunning = () => !!ctx && ctx.state === 'running';

    // AudioContextを用意する。iOSではタップと同じ処理の中で呼ぶ必要がある
    function getContext() {
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}  // 消音スイッチ対策
      if (!ctx && AudioCtx) { try { ctx = new AudioCtx(); } catch (e) {} }
      if (ctx && ctx.state === 'suspended') quiet(() => ctx.resume());
      return ctx;
    }

    // 音が鳴らせる状態になるのを待つ（最大0.5秒）。鳴らせなければ null
    async function ready() {
      const c = getContext();
      if (!c) return null;
      if (c.state !== 'running') await Promise.race([quiet(() => c.resume()), wait(500)]);
      return isRunning() ? c : null;
    }

    // 角ばったビープ（終了音用）
    function beep(when, freq, dur) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const v = SOUND.beepVolume;
      osc.type = 'square';
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.0001, when);
      gain.gain.linearRampToValueAtTime(v, when + 0.005);
      gain.gain.setValueAtTime(v, when + dur - 0.02);       // 終わりぎわまで音量を保つ
      gain.gain.linearRampToValueAtTime(0.0001, when + dur);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(when);
      osc.stop(when + dur + 0.05);
      nodes.push(osc);
    }

    // やさしいチャイム音（基音＋2倍音。やわらかく立ち上がり、余韻を残して消える）
    function chime(when, freq) {
      const { peak, attack, hold, decay, partials } = SOUND.chime;
      const master = ctx.createGain();
      master.gain.setValueAtTime(0.0001, when);
      master.gain.linearRampToValueAtTime(peak, when + attack);
      master.gain.setValueAtTime(peak, when + hold);
      master.gain.exponentialRampToValueAtTime(0.001, when + decay);
      master.connect(ctx.destination);

      const total = partials.reduce((sum, p) => sum + p.level, 0);
      partials.forEach(p => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq * p.ratio;
        gain.gain.value = p.level / total;
        osc.connect(gain); gain.connect(master);
        osc.start(when);
        osc.stop(when + decay + 0.04);
        nodes.push(osc);
      });
    }

    // 「ポン、ポン」と2回
    function signal(when, freq = SOUND.signalFreq) {
      chime(when, freq);
      chime(when + SOUND.signalGap, freq);
    }

    // 終了の合図
    function finish(when) {
      SOUND.finishNotes.forEach(n => beep(when + n.at, n.freq, n.dur));
    }

    return {
      supported: !!AudioCtx,
      ready,

      // 開始時に、開始音・各投の合図・終了音をまとめて予約する（画面が暗くなってもずれない）
      scheduleAll() {
        if (!isRunning()) return;
        const base = ctx.currentTime;
        signal(base);
        POUR_CHANGES.forEach(t => signal(base + t));
        finish(base + FINISH);
      },

      cancelAll() {
        nodes.forEach(osc => {
          try { osc.stop(); } catch (e) {}
          try { osc.disconnect(); } catch (e) {}
        });
        nodes = [];
      },

      playStop() { if (isRunning()) signal(ctx.currentTime + SOUND.lead, SOUND.stopFreq); },

      async test() {
        if (await ready()) signal(ctx.currentTime + SOUND.lead);
      },
    };
  })();

  /* ==================================================================
   * 画面を消さない
   *   標準の Wake Lock API と、音なし動画を流し続ける方式（NoSleep.js）を併用。
   *   iOSのホーム画面アプリでは Wake Lock が効かない版があるため、動画方式で補う。
   * ================================================================== */

  const keepAwake = (() => {
    let wakeLock = null;
    let video = null;

    function getVideo() {
      if (video) return video;
      video = document.createElement('video');
      video.setAttribute('playsinline', '');
      video.setAttribute('muted', '');
      video.setAttribute('title', 'No Sleep');
      video.muted = true;
      const source = document.createElement('source');
      source.src = NOSLEEP_MP4;
      source.type = 'video/mp4';
      video.appendChild(source);
      video.addEventListener('loadedmetadata', () => {
        video.addEventListener('timeupdate', () => {      // 終わりに達しないよう再生位置を戻し続ける
          if (video.currentTime > 0.5) video.currentTime = Math.random();
        });
      });
      return video;
    }

    return {
      on() {
        if ('wakeLock' in navigator) {
          quiet(() => navigator.wakeLock.request('screen').then(lock => { wakeLock = lock; }));
        }
        quiet(() => getVideo().play());
      },
      off() {
        if (wakeLock) quiet(() => wakeLock.release());
        wakeLock = null;
        if (video) video.pause();
      },
    };
  })();

  /* ==================================================================
   * 画面表示
   * ================================================================== */

  const view = (() => {
    const el = {
      pour: $('pour'), pourNum: $('pourNum'), phase: $('phase'),
      time: $('time'), next: $('next'),
      start: $('btnStart'), stop: $('btnStop'),
    };

    // タイムライン（5つのバー）を作る
    const cells = POURS.map((pour, i) => {
      const cell = document.createElement('div');
      cell.className = `cell ${pour.phase}`;
      cell.style.flex = `${pour.end - pour.start} 1 0`;    // 長さに比例した幅
      const endLabel = i === POURS.length - 1 ? `<span>${formatTime(FINISH)}</span>` : '';
      cell.innerHTML =
        '<div class="bar"><div class="fill"></div></div>' +
        `<div class="lab"><span><span class="k">${i + 1}</span>${formatTime(pour.start)}</span>${endLabel}</div>`;
      $('timeline').appendChild(cell);
      return { cell, fill: cell.querySelector('.fill'), pour };
    });

    function renderPour(state, pourIdx) {
      el.pour.classList.toggle('idle', state === 'idle');

      if (state !== 'idle' && pourIdx === DONE) {
        setHTML(el.pourNum, '<span class="done">抽出完了</span>');
        setHTML(el.phase, 'ドリッパーを外しましょう');
        el.phase.className = 'phase';
        return;
      }
      const shown = state === 'idle' ? 0 : pourIdx;
      setHTML(el.pourNum, `<span class="n">${shown + 1}</span><span class="u">投目</span>`);
      if (state === 'idle') {
        setHTML(el.phase, '開始を押すと計測がはじまります');
        el.phase.className = 'phase';
      } else {
        const phase = POURS[shown].phase;
        setHTML(el.phase, PHASE_TEXT[phase]);
        el.phase.className = `phase ${phase}`;
      }
    }

    function renderNext(state, pourIdx, t) {
      let html;
      if (state === 'idle') {
        html = '合図：' + [...POUR_CHANGES, FINISH].map(formatTime).join(' / ');
      } else if (state === 'stopped') {
        html = '停止中';
      } else if (pourIdx === DONE) {
        html = `${formatTime(FINISH)}を過ぎました。落ち切ったら停止`;
      } else {
        const isLast = pourIdx === DONE - 1;
        const target = isLast ? FINISH : POURS[pourIdx].end;
        const label = isLast ? '終了まで' : `${pourIdx + 2}投目まで`;
        html = `${label}<b>${formatTime(Math.ceil(target - t))}</b>`;
      }
      setHTML(el.next, html);
    }

    function renderTimeline(state, pourIdx, t) {
      cells.forEach(({ cell, fill, pour }, i) => {
        const ratio = state === 'idle' ? 0 : Math.min(1, Math.max(0, (t - pour.start) / (pour.end - pour.start)));
        fill.style.width = `${(ratio * 100).toFixed(2)}%`;
        cell.classList.toggle('now', state !== 'idle' && pourIdx === i);
      });
    }

    return {
      render(state, t, pourIdx) {
        renderPour(state, pourIdx);
        setHTML(el.time, formatTime(t));
        renderNext(state, pourIdx, t);
        renderTimeline(state, pourIdx, t);
        el.start.disabled = state === 'running';
        el.stop.disabled = state !== 'running';
      },

      // 投が切り替わった一瞬だけ背景を光らせる（音が出せないときの保険）
      flash() {
        el.pour.classList.remove('flash');
        void el.pour.offsetWidth;          // アニメーションを最初からやり直すため
        el.pour.classList.add('flash');
      },
    };
  })();

  /* ==================================================================
   * タイマー本体
   * ================================================================== */

  let state = 'idle';        // idle（待機） | running（計測中） | stopped（停止）
  let startedAt = 0;         // 開始した時刻（ms）
  let elapsed = 0;           // 停止時点の経過秒
  let ticker = null;
  let lastPour = null;       // 直前に表示していた投（切り替わり検出用）

  const currentTime = () => state === 'running' ? (performance.now() - startedAt) / 1000 : elapsed;

  function render() {
    const t = currentTime();
    const pourIdx = pourIndexAt(t);
    view.render(state, t, pourIdx);
    if (state === 'running' && lastPour !== null && pourIdx !== lastPour) view.flash();
    lastPour = pourIdx;
  }

  async function start() {
    if (state === 'running') return;
    keepAwake.on();                        // タップと同じ処理の中で始める（iOS対策）
    await sound.ready();
    if (state === 'running') return;       // 待っている間に二重で押された場合

    sound.cancelAll();
    startedAt = performance.now();
    sound.scheduleAll();
    state = 'running';
    lastPour = null;
    clearInterval(ticker);
    ticker = setInterval(render, 100);
    render();

    if (!sound.supported) {
      $('note').textContent = 'この環境では音を鳴らせません。画面の表示で確認してください。';
    }
  }

  function stop() {
    if (state !== 'running') return;
    elapsed = currentTime();
    state = 'stopped';
    clearInterval(ticker);
    sound.cancelAll();
    sound.playStop();
    keepAwake.off();
    render();
  }

  function reset() {
    clearInterval(ticker);
    sound.cancelAll();
    keepAwake.off();
    state = 'idle';
    elapsed = 0;
    lastPour = null;
    render();
  }

  /* ==================================================================
   * 起動
   * ================================================================== */

  $('btnStart').addEventListener('click', start);
  $('btnStop').addEventListener('click', stop);
  $('btnReset').addEventListener('click', reset);
  $('btnTest').addEventListener('click', () => sound.test());

  // 画面に戻ってきたとき、計測中なら画面ロックを取り直して表示を更新する
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && state === 'running') {
      keepAwake.on();
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
