<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="4:6タイマー">
<title>4:6メソッド タイマー</title>
<style>
  :root {
    --bg: #ECEFF1;
    --surface: #FFFFFF;
    --ink: #2B1E18;
    --muted: #6B6058;
    --line: #CDD3D8;
    --blue: #2E5E8E;
    --blue-track: #CFDCEA;
    --brown: #8A5330;
    --brown-track: #E0D6CE;
    --on-blue: #FFFFFF;
    --flash: #FFF0B8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1512;
      --surface: #271E1A;
      --ink: #F0E8E2;
      --muted: #A9998E;
      --line: #3B302A;
      --blue: #7FAEDD;
      --blue-track: #2B3B4B;
      --brown: #C58A5E;
      --brown-track: #3A2E27;
      --on-blue: #10202F;
      --flash: #4A3B12;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1512;
    --surface: #271E1A;
    --ink: #F0E8E2;
    --muted: #A9998E;
    --line: #3B302A;
    --blue: #7FAEDD;
    --blue-track: #2B3B4B;
    --brown: #C58A5E;
    --brown-track: #3A2E27;
    --on-blue: #10202F;
    --flash: #4A3B12;
    color-scheme: dark;
  }

  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: inherit; }

  body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  main {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 20px 16px;
    display: flex;
    flex-direction: column;
  }

  /* ---- 何投目か（主役） ---- */
  .pour {
    padding: 8px 12px 14px;
    border-radius: 18px;
    text-align: center;
    transition: color .2s;
  }
  .pour.flash { animation: flash 0.9s ease-out; }
  @keyframes flash {
    0%   { background: var(--flash); }
    100% { background: transparent; }
  }
  .pour-num {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    line-height: 1;
  }
  .pour-num .n {
    font-size: clamp(120px, 40vw, 190px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .pour-num .u { font-size: clamp(30px, 9vw, 42px); font-weight: 600; }
  .pour-num .done { font-size: clamp(56px, 18vw, 84px); font-weight: 600; padding: 30px 0 22px; }
  .pour.idle .pour-num { color: var(--muted); }
  .phase {
    margin: 6px 0 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--muted);
    min-height: 1.5em;
  }
  .phase.a { color: var(--blue); }
  .phase.b { color: var(--brown); }

  /* ---- 経過時間 ---- */
  .time {
    margin-top: 6px;
    text-align: center;
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
    font-size: clamp(64px, 21vw, 100px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  .next {
    margin-top: 4px;
    text-align: center;
    font-size: 16px;
    color: var(--muted);
    min-height: 1.6em;
  }
  .next b {
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    margin-left: 6px;
  }

  /* ---- タイムライン ---- */
  .timeline {
    display: flex;
    gap: 4px;
    margin-top: 26px;
  }
  .cell { min-width: 0; }
  .bar {
    position: relative;
    height: 16px;
    border-radius: 8px;
    overflow: hidden;
  }
  .cell.a .bar { background: var(--blue-track); }
  .cell.b .bar { background: var(--brown-track); }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; }
  .cell.a .fill { background: var(--blue); }
  .cell.b .fill { background: var(--brown); }
  .lab {
    margin-top: 8px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
  }
  .lab .k { font-size: 16px; font-weight: 700; margin-right: 4px; }
  .cell.now .lab { color: var(--ink); }
  .cell.now .lab .k { font-size: 20px; }
  .legend {
    display: flex;
    gap: 16px;
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
  }
  .legend i {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 5px;
    margin-right: 6px;
    vertical-align: baseline;
  }

  /* ---- 操作 ---- */
  .controls {
    margin-top: auto;
    padding-top: 28px;
    display: flex;
    gap: 12px;
  }
  .btn {
    flex: 1;
    min-height: 68px;
    border-radius: 16px;
    font: inherit;
    font-size: 24px;
    font-weight: 700;
    cursor: pointer;
    border: 2px solid var(--ink);
    background: transparent;
    color: var(--ink);
  }
  .btn.start { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
  .btn:disabled { opacity: .3; cursor: default; }
  .btn:focus-visible, .link:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }

  .foot {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .link {
    font: inherit;
    font-size: 15px;
    color: var(--ink);
    background: none;
    border: 0;
    padding: 10px 4px;
    text-decoration: underline;
    text-underline-offset: 3px;
    cursor: pointer;
  }
  .note { margin: 8px 0 0; font-size: 12px; color: var(--muted); line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) {
    .pour.flash { animation: none; }
  }
</style>
</head>
<body>
<main>
  <section class="pour idle" id="pour">
    <div class="pour-num" id="pourNum"><span class="n">1</span><span class="u">投目</span></div>
    <p class="phase" id="phase" aria-live="polite">開始を押すと計測がはじまります</p>
  </section>

  <div class="time" id="time" role="timer" aria-label="経過時間">0:00</div>
  <div class="next" id="next"></div>

  <div class="timeline" id="tl" aria-hidden="true"></div>
  <div class="legend" aria-hidden="true">
    <span><i style="background:var(--blue)"></i>前半 甘み・酸味</span>
    <span><i style="background:var(--brown)"></i>後半 濃度</span>
  </div>

  <div class="controls">
    <button class="btn start" id="btnStart">開始</button>
    <button class="btn" id="btnStop" disabled>停止</button>
  </div>

  <div class="foot">
    <button class="link" id="btnReset">リセット</button>
    <button class="link" id="btnTest">音を確認</button>
  </div>
  <p class="note" id="note">音が出ないときは、iPhoneの消音スイッチ（側面）をオフにして、音量を上げてください。</p>
</main>

<script>
(function () {
  // ---- 4:6メソッドのスケジュール（秒） ----
  var SEGS = [
    { s: 0,   e: 45,  g: 'a' },  // 1投目
    { s: 45,  e: 90,  g: 'a' },  // 2投目
    { s: 90,  e: 135, g: 'b' },  // 3投目
    { s: 135, e: 165, g: 'b' },  // 4投目
    { s: 165, e: 210, g: 'b' }   // 5投目
  ];
  var END = 210;                       // 3:30
  var BEEPS = [45, 90, 135, 165];      // 各投の切り替え合図（2投目〜5投目）

  var $ = function (id) { return document.getElementById(id); };
  var elPour = $('pour'), elNum = $('pourNum'), elPhase = $('phase');
  var elTime = $('time'), elNext = $('next'), elTl = $('tl');
  var btnStart = $('btnStart'), btnStop = $('btnStop');

  function fmt(sec) {
    sec = Math.max(0, Math.floor(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  // ---- タイムライン生成 ----
  var cells = SEGS.map(function (seg, i) {
    var c = document.createElement('div');
    c.className = 'cell ' + seg.g;
    c.style.flex = (seg.e - seg.s) + ' 1 0';
    var endLabel = (i === SEGS.length - 1) ? '<span>' + fmt(END) + '</span>' : '';
    c.innerHTML =
      '<div class="bar"><div class="fill"></div></div>' +
      '<div class="lab"><span><span class="k">' + (i + 1) + '</span>' + fmt(seg.s) + '</span>' + endLabel + '</div>';
    elTl.appendChild(c);
    return { el: c, fill: c.querySelector('.fill'), seg: seg };
  });

  // ---- 音 ----
  var ctx = null, nodes = [], audioOK = true;

  function ensureAudio() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { audioOK = false; return null; }
      try { ctx = new AC(); } catch (e) { audioOK = false; return null; }
    }
    if (ctx.state === 'suspended') { try { ctx.resume(); } catch (e) {} }
    return ctx;
  }

  var VOL = 0.9;   // 音量（最大 1.0）
  function beepAt(when, freq, dur) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'square';                       // 正弦波より大きく聞こえる音色
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, when);
    g.gain.linearRampToValueAtTime(VOL, when + 0.005);
    g.gain.setValueAtTime(VOL, when + dur - 0.02);   // 終わりぎわまで音量を保つ
    g.gain.linearRampToValueAtTime(0.0001, when + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(when);
    o.stop(when + dur + 0.05);
    nodes.push(o);
  }

  // すべての合図は「ピッ、ピッ」と2回鳴らす
  function beep2(when, freq) {
    beepAt(when, freq, 0.18);
    beepAt(when + 0.26, freq, 0.18);
  }

  function scheduleBeeps(base) {
    beep2(base, 1320);                                   // 開始
    BEEPS.forEach(function (t) { beep2(base + t, 1320); }); // 45秒・1:30・2:15・2:45
    beep2(base + END, 880);                             // 3:30 終了（低めの音）
  }

  function clearBeeps() {
    nodes.forEach(function (o) { try { o.stop(); } catch (e) {} try { o.disconnect(); } catch (e) {} });
    nodes = [];
  }

  // ---- 画面を消さない ----
  // 標準のWake Lock APIと、音なし動画を流し続ける方式（NoSleep.js, MIT License）を併用する。
  // iOSのホーム画面アプリではWake Lockが効かない版があるため、動画方式で補う。
  var wl = null, sleepVideo = null;
  var NOSLEEP_MP4 = "data:video/mp4;base64,AAAAHGZ0eXBNNFYgAAACAGlzb21pc28yYXZjMQAAAAhmcmVlAAAGF21kYXTeBAAAbGliZmFhYyAxLjI4AABCAJMgBDIARwAAArEGBf//rdxF6b3m2Ui3lizYINkj7u94MjY0IC0gY29yZSAxNDIgcjIgOTU2YzhkOCAtIEguMjY0L01QRUctNCBBVkMgY29kZWMgLSBDb3B5bGVmdCAyMDAzLTIwMTQgLSBodHRwOi8vd3d3LnZpZGVvbGFuLm9yZy94MjY0Lmh0bWwgLSBvcHRpb25zOiBjYWJhYz0wIHJlZj0zIGRlYmxvY2s9MTowOjAgYW5hbHlzZT0weDE6MHgxMTEgbWU9aGV4IHN1Ym1lPTcgcHN5PTEgcHN5X3JkPTEuMDA6MC4wMCBtaXhlZF9yZWY9MSBtZV9yYW5nZT0xNiBjaHJvbWFfbWU9MSB0cmVsbGlzPTEgOHg4ZGN0PTAgY3FtPTAgZGVhZHpvbmU9MjEsMTEgZmFzdF9wc2tpcD0xIGNocm9tYV9xcF9vZmZzZXQ9LTIgdGhyZWFkcz02IGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTI1IHNjZW5lY3V0PTQwIGludHJhX3JlZnJlc2g9MCByY19sb29rYWhlYWQ9NDAgcmM9Y3JmIG1idHJlZT0xIGNyZj0yMy4wIHFjb21wPTAuNjAgcXBtaW49MCBxcG1heD02OSBxcHN0ZXA9NCB2YnZfbWF4cmF0ZT03NjggdmJ2X2J1ZnNpemU9MzAwMCBjcmZfbWF4PTAuMCBuYWxfaHJkPW5vbmUgZmlsbGVyPTAgaXBfcmF0aW89MS40MCBhcT0xOjEuMDAAgAAAAFZliIQL8mKAAKvMnJycnJycnJycnXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXiEASZACGQAjgCEASZACGQAjgAAAAAdBmjgX4GSAIQBJkAIZACOAAAAAB0GaVAX4GSAhAEmQAhkAI4AhAEmQAhkAI4AAAAAGQZpgL8DJIQBJkAIZACOAIQBJkAIZACOAAAAABkGagC/AySEASZACGQAjgAAAAAZBmqAvwMkhAEmQAhkAI4AhAEmQAhkAI4AAAAAGQZrAL8DJIQBJkAIZACOAAAAABkGa4C/AySEASZACGQAjgCEASZACGQAjgAAAAAZBmwAvwMkhAEmQAhkAI4AAAAAGQZsgL8DJIQBJkAIZACOAIQBJkAIZACOAAAAABkGbQC/AySEASZACGQAjgCEASZACGQAjgAAAAAZBm2AvwMkhAEmQAhkAI4AAAAAGQZuAL8DJIQBJkAIZACOAIQBJkAIZACOAAAAABkGboC/AySEASZACGQAjgAAAAAZBm8AvwMkhAEmQAhkAI4AhAEmQAhkAI4AAAAAGQZvgL8DJIQBJkAIZACOAAAAABkGaAC/AySEASZACGQAjgCEASZACGQAjgAAAAAZBmiAvwMkhAEmQAhkAI4AhAEmQAhkAI4AAAAAGQZpAL8DJIQBJkAIZACOAAAAABkGaYC/AySEASZACGQAjgCEASZACGQAjgAAAAAZBmoAvwMkhAEmQAhkAI4AAAAAGQZqgL8DJIQBJkAIZACOAIQBJkAIZACOAAAAABkGawC/AySEASZACGQAjgAAAAAZBmuAvwMkhAEmQAhkAI4AhAEmQAhkAI4AAAAAGQZsAL8DJIQBJkAIZACOAAAAABkGbIC/AySEASZACGQAjgCEAS   function getVideo() {
    if (sleepVideo) return sleepVideo;
    var v = document.createElement('video');
    v.setAttribute('playsinline', '');
    v.setAttribute('muted', '');
    v.setAttribute('title', 'No Sleep');
    v.muted = true;
    var s = document.createElement('source');
    s.src = NOSLEEP_MP4;
    s.type = 'video/mp4';
    v.appendChild(s);
    v.addEventListener('loadedmetadata', function () {
      v.addEventListener('timeupdate', function () {
        if (v.currentTime > 0.5) v.currentTime = Math.random();
      });
    });
    sleepVideo = v;
    return v;
  }

  function lock() {
    try {
      if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').then(function (l) { wl = l; }, function () {});
      }
    } catch (e) {}
    try {
      var p = getVideo().play();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }
  function unlock() {
    try { if (wl) wl.release(); } catch (e) {}
    wl = null;
    try { if (sleepVideo) sleepVideo.pause(); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible') {
      if (state === 'running') { lock(); tick(); }
    }
  });

  // ---- 状態 ----
  var state = 'idle';       // idle | running | stopped
  var t0 = 0, elapsed = 0, timer = null, lastPour = -2;

  function pourIndex(t) {
    if (t >= END) return 5;  // 完了
    for (var i = SEGS.length - 1; i >= 0; i--) if (t >= SEGS[i].s) return i;
    return 0;
  }

  var cache = {};
  function setHTML(el, key, html) {
    if (cache[key] !== html) { cache[key] = html; el.innerHTML = html; }
  }
  function setText(el, key, text) {
    if (cache[key] !== text) { cache[key] = text; el.textContent = text; }
  }

  function render(t) {
    var p = pourIndex(t);

    // 何投目か
    if (p >= 5 && state !== 'idle') {
      setHTML(elNum, 'num', '<span class="done">抽出完了</span>');
      setText(elPhase, 'phase', 'ドリッパーを外しましょう');
      elPhase.className = 'phase';
    } else {
      var shown = (state === 'idle') ? 0 : p;
      setHTML(elNum, 'num', '<span class="n">' + (shown + 1) + '</span><span class="u">投目</span>');
      if (state === 'idle') {
        setText(elPhase, 'phase', '開始を押すと計測がはじまります');
        elPhase.className = 'phase';
      } else {
        var g = SEGS[shown].g;
        setText(elPhase, 'phase', g === 'a' ? '甘み・酸味を決める（前半40%）' : '濃度を決める（後半60%）');
        elPhase.className = 'phase ' + g;
      }
    }
    elPour.classList.toggle('idle', state === 'idle');

    // 切り替わりの一瞬だけハイライト（音が出せない時の保険）
    if (state === 'running' && p !== lastPour && lastPour !== -2) {
      elPour.classList.remove('flash');
      void elPour.offsetWidth;
      elPour.classList.add('flash');
    }
    lastPour = p;

    // 時間
    setText(elTime, 'time', fmt(t));

    // 次の合図
    var nextHTML;
    if (state === 'idle') {
      nextHTML = '合図：0:45 / 1:30 / 2:15 / 2:45 / 3:30';
    } else if (state === 'stopped') {
      nextHTML = '停止中';
    } else if (p >= 5) {
      nextHTML = '3:30を過ぎました。落ち切ったら停止';
    } else {
      var target = (p < 4) ? SEGS[p].e : END;
      var label = (p < 4) ? (p + 2) + '投目まで' : '終了まで';
      nextHTML = label + '<b>' + fmt(Math.ceil(target - t)) + '</b>';
    }
    setHTML(elNext, 'next', nextHTML);

    // タイムライン
    cells.forEach(function (c, i) {
      var seg = c.seg;
      var ratio = state === 'idle' ? 0 : Math.min(1, Math.max(0, (t - seg.s) / (seg.e - seg.s)));
      c.fill.style.width = (ratio * 100).toFixed(2) + '%';
      c.el.classList.toggle('now', state !== 'idle' && p === i);
    });
  }

  function tick() {
    var t = state === 'running' ? (performance.now() - t0) / 1000 : elapsed;
    render(t);
  }

  function updateButtons() {
    btnStart.disabled = state === 'running';
    btnStop.disabled = state !== 'running';
  }

  function start() {
    if (state === 'running') return;
    var c = ensureAudio();   // タップ直後に音を有効化（iOS対策）
    lock();                  // 同じタップの中で画面スリープ防止を開始
    var go = function () {
      if (state === 'running') return;
      clearBeeps();
      t0 = performance.now();
      if (c && c.state === 'running') scheduleBeeps(c.currentTime);
      state = 'running';
      lastPour = -2;
      updateButtons();
      clearInterval(timer);
      timer = setInterval(tick, 100);
      tick();
      if (!audioOK) document.getElementById('note').textContent = 'この環境では音を鳴らせません。画面の表示で確認してください。';
    };
    if (c && c.state !== 'running') {
      var done = false;
      var once = function () { if (!done) { done = true; go(); } };
      try { c.resume().then(once, once); } catch (e) { once(); }
      setTimeout(once, 500);
    } else {
      go();
    }
  }

  function stop() {
    if (state !== 'running') return;
    elapsed = (performance.now() - t0) / 1000;
    state = 'stopped';
    clearInterval(timer);
    clearBeeps();
    if (ctx && ctx.state === 'running') beep2(ctx.currentTime + 0.02, 880); // 停止音
    unlock();
    updateButtons();
    tick();
  }

  function reset() {
    clearInterval(timer);
    clearBeeps();
    unlock();
    state = 'idle';
    elapsed = 0;
    lastPour = -2;
    updateButtons();
    tick();
  }

  btnStart.addEventListener('click', start);
  btnStop.addEventListener('click', stop);
  $('btnReset').addEventListener('click', reset);
  $('btnTest').addEventListener('click', function () {
    var c = ensureAudio();
    if (!c) return;
    var play = function () { beep2(c.currentTime + 0.05, 1320); };
    if (c.state === 'running') play();
    else { try { c.resume().then(play, play); } catch (e) { play(); } }
  });

  tick();
})();
</script>
</body>
</html>
